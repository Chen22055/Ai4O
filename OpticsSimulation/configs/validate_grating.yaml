# 本配置文件用于光栅衍射验证实验。
# 光路顺序在 run_validation_grating.py 中构造为：
# plane wave -> grating -> thin lens -> free-space propagation to focal plane -> intensity output

simulation:
  name: grating_diffraction_validation
  wavelength: 5.32e-7       # meter, 532 nm

grid:
  shape: [1024, 1024]       # [ny, nx]
  pixel_pitch: 6.4e-6       # meter

grating:
  # Available types: binary_amplitude, sinusoidal_phase.
  type: binary_amplitude
  period: 8.0e-5            # meter
  duty_cycle: 0.5
  orientation: x            # x means periodic along x, diffraction spots separate along x.
  phase_depth: 1.5707963267948966

lens:
  focal_length: 5.0e-2      # meter

propagation:
  distance: 5.0e-2          # meter. Equal to focal_length for Fourier-plane diffraction pattern.
  method: angular_spectrum

analysis:
  orders: [-3, -2, -1, 0, 1, 2, 3]
  peak_search_half_width: 2.0e-5  # meter
  profile_average_half_width: 2   # pixels averaged around central row/column

output:
  directory: OpticsSimulation/outputs/figures/grating_validation
  prefix: grating_diffraction_validation
  dpi: 200
